<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Locations</li></ul><p>Article</p><h1>Locations</h1><p>Save the places your team needs to find or visit.</p></section><h2>Overview</h2><p>A Location can represent an entrance, room, checkpoint, or delivery point. Routes reuse these Project places as Stops.</p><h2>Add a Location</h2><ol><li><p>Open your Project, tap More, then Edit Map.</p></li><li><p>Tap Add, then Location.</p></li><li><p>Tap the map where you want to place the Location.</p></li><li><p>Enter a name and, if useful, a Detail. Choose a Region and Layer if you have created them.</p></li><li><p>Tap Done.</p></li><li><p>Tap Save in the map toolbar to save your changes.</p></li></ol><p>You can add several Locations before saving the map.</p><h2>Change a Location</h2><p>While editing the map, tap a Location marker. Change its name, details, Region, or Layer. Tap Done, review Apply Changes if it appears, then tap Save in the map toolbar.</p><p>Changes to an existing Location can affect historical activity logs. Check that you have selected the correct place before continuing.</p><h2>Move a Location</h2><ol><li><p>Open the Location while editing the map.</p></li><li><p>Tap Relocate Location, then tap the new position on the map.</p></li><li><p>Tap Save to accept the position.</p></li><li><p>Tap Done in the Location editor, then Save in the map toolbar.</p></li></ol><p>Cancel during relocation restores its previous position. Cancel in the map toolbar discards the whole map editing session.</p><h2>Draw a Location’s area</h2><p>An area shows the space associated with a Location, such as its responsibility or delivery area. You need Project edit permission.</p><ol><li><p>Open the Location while editing the Project map.</p></li><li><p>Tap Edit Area to work on its boundary on the map.</p></li><li><p>Tap the map to add boundary vertices. Review the shape as you add them.</p></li><li><p>Use Clear if you need to remove the draft boundary and redraw it.</p></li><li><p>Tap Done in the Location editor and review Apply Changes if it appears.</p></li><li><p>Tap Save in the map toolbar when the map changes are ready.</p></li></ol><p>Cancel discards the map editing session. Review existing Location changes carefully because they can affect historical activity views.</p><h2>Delete a Location</h2><p>Open the Location while editing the map, tap Delete Location, and confirm. Tap Save in the map toolbar when you are ready to save the map changes.</p><p>To view a Location without editing, tap its marker on the map. See <a href="../map/index.html">Map</a>.</p></article></noscript><div id="app"></div><!-- site-footer -->
