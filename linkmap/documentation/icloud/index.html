<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>iCloud</li></ul><p>Article</p><h1>iCloud</h1><p>iCloud stores your LinkMap Projects and makes them available through your Apple Account.</p></section><h2>Your account and Projects</h2><p>Projects you create are private by default and stored in your personal iCloud account. Use the same Apple Account on iOS and the web to access your own and shared Projects. The iOS app uses the account in your device settings; the web app requires a separate browser sign-in.</p><p>iCloud synchronises stored project information. Reload the web map to see changes made in the iOS app. See <a href="../ios-platform/index.html">LinkMap for iOS</a> or <a href="../web-platform/index.html">LinkMap for Web</a> for account setup and the actions available on each platform.</p><h2>Shared work</h2><p>Sharing gives invited collaborators access to a Project according to the owner’s permissions. It does not share the rest of your personal iCloud files. See <a href="../sharing/index.html">Sharing</a> for invitations and joining a shared Project.</p><h2>Manage your data</h2><p>Manage project records in LinkMap. Removing the app from a device may leave its data in iCloud. Read the <a href="https://endsunset.github.io/linkmap/privacy-policy/">privacy policy</a> for storage, sharing, and deletion details.</p></article></noscript><div id="app"></div><!-- site-footer -->
