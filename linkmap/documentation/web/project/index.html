<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for Web</a></li><li>Project</li></ul><p>Article</p><h1>Project</h1><p>Choose a Project and browse its saved places and Items.</p></section><h2>Choose a Project</h2><ol><li><p>Choose Project in the sidebar. The panel is titled Projects.</p></li><li><p>Sign in if requested, then wait for the list to load.</p></li><li><p>Enter part of a name in Find a project if you need to narrow the list.</p></li><li><p>Choose a Project and wait for its map data to load.</p></li></ol><p>The first Project opens automatically when the list loads. Projects are listed newest first. A Shared badge identifies Projects shared with you that you have already accepted. To change Projects, choose another name in the list.</p><p>On a phone, choosing a Project closes the panel to reveal the map. Choose Project again to browse its records.</p><h2>Browse Project records</h2><p>Under Browse project, choose Project details to see whether the Project is private or shared and the counts of its Locations, Regions, Layers, and Items. Choose a count to open that list.</p><p>You can also open Locations, Regions, Layers, or Items directly under Browse project. Choose a record to inspect it. Back returns through related details, and Close details closes the panel. You can continue using the map while details are open.</p><p>See <a href="../locations/index.html">Locations</a>, <a href="../regions-and-layers/index.html">Regions and Layers</a>, and <a href="../items/index.html">Items</a> for the information available in each list.</p><h2>Create, edit, or share a Project</h2><p>Use LinkMap for iOS to create, rename, edit, delete, or share a Project and to accept invitations. The web app only displays Projects your signed-in account can access; it has no permission-management or invitation-acceptance controls.</p><p>After a change in iOS, use Refresh map data for the selected Project, or reload the page to update the Projects list. See <a href="../icloud/index.html">iCloud</a> if a Project is missing or cannot load.</p></article></noscript><div id="app"></div><!-- site-footer -->
