<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Project</li></ul><p>Article</p><h1>Project</h1><p>Keep the places, reusable Items, and Activities for one area together in a Project.</p></section><h2>Create a Project</h2><ol><li><p>Tap Projects at the upper left of the map.</p></li><li><p>Tap Project Actions (the ellipsis), then Add Project.</p></li><li><p>Enter a name, then tap Save.</p></li></ol><p>The Project opens in the Console. Add places with <a href="../locations/index.html">Locations</a>, or open Activities to plan work.</p><h2>Open another Project</h2><p>Tap Projects, then tap the Project you want to use. Enter a name in Search Projects to find it in the list.</p><p>The Console shows the open Project. Activities opens its work, Items opens its reusable resource definitions, and Project Map opens its map tools. Recently opened Projects appear first. Pull down the Projects list to refresh it.</p><p>To return to the map without changing Projects, tap the exposed map strip beside the list or drag that strip left. Back in the Console returns through Route → Assignment → Activity → Project.</p><h2>Change the Project name</h2><p>If you own the Project, open its More menu and tap Name. Enter the new name, then tap Save.</p><h2>Edit the Project map</h2><p>Open the Project’s More menu and tap Edit Map. You need permission to edit the Project. Add or change Locations, Regions, and Layers, then tap Save in the map toolbar. Tap Cancel there to discard the map editing session.</p><p>Project map changes also affect the places used by existing Activities. Review the Apply Changes prompt when editing an existing place.</p><h2>Use Project Map tools</h2><ol><li><p>Open Project Map from the Project’s Console.</p></li><li><p>Use Location List to browse places, or Regions and Layers to inspect their organization.</p></li><li><p>Use Edit Locations when you have Project edit permission.</p></li><li><p>Use Refresh Map Data to reload the Project’s places.</p></li></ol><p>When there is a current Activity with Route paths, Shortest Path Display changes how its paths are displayed. This does not rearrange saved Stops. See <a href="../map/index.html">Map</a> and <a href="../routes-and-stops/index.html">Routes and Stops</a>.</p><h2>Share a Project</h2><p>The owner’s More menu includes Share. Project sharing covers the map and Item definitions; share each Activity separately for its work. See <a href="../sharing/index.html">Sharing</a> for invitations and permissions.</p><h2>Leave a shared Project</h2><p>If you joined someone else’s Project:</p><ol><li><p>Open the Project’s More menu.</p></li><li><p>Tap Leave Project.</p></li><li><p>Review the confirmation, then choose Leave Project to continue or Cancel to keep your access.</p></li></ol><p>Leaving removes your access to the Project and its shared Activities. The Project and its data remain available to the owner and other participants. Ask the owner for invitations if you need to join again.</p></article></noscript><div id="app"></div><!-- site-footer -->
