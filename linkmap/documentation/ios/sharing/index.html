<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Sharing</li></ul><p>Article</p><h1>Sharing</h1><p>Invite people to your Project map and the Activities they need.</p></section><h2>Overview</h2><p>Project and Activity invitations are separate. Project permissions control access to the map; Activity permissions control access to that round of work. Sharing one does not automatically share the other.</p><h2>Share a Project</h2><p>If you own the Project:</p><ol><li><p>Open the Project’s More menu, then tap Share.</p></li><li><p>Tap Start Sharing if you have not shared it before.</p></li><li><p>In the sharing controls, choose who can join and whether they can view or edit.</p></li><li><p>Send the invitation to your collaborators.</p></li></ol><p>After sharing has been set up, tap Control to manage access. A QR code is available when access by link is enabled.</p><h2>Share an Activity</h2><ol><li><p>Share the Project first and ask collaborators to accept that invitation.</p></li><li><p>Open the Activity’s More menu, then Share.</p></li><li><p>Tap Start Sharing if needed, choose permissions, and send the Activity invitation.</p></li></ol><p>The owner can allow viewing or editing during Planning and Active. Planning edit access allows setup changes; Active edit access allows Item transfers and Stop updates. Ended Activities support viewing only.</p><p>Starting or ending an Activity revokes its current invitation and removes previous participants. It does not automatically create a new invitation. Open Share → Start Sharing again, then send the new invitation for the new state. Project sharing is unchanged.</p><h2>Accept an invitation</h2><p>Open the invitation on a device with LinkMap installed. Accept the Project invitation before the Activity invitation.</p><p>To scan a QR invitation, tap Projects, open Project Actions (the ellipsis), then tap Scan. Activities also has a Scan action in Activity Actions. Allow camera access when prompted; if it was denied, enable it in device Settings or use the invitation link instead.</p><p>After joining, choose the shared Project in Projects and open the Activity you were invited to.</p><h2>If shared work is unavailable</h2><p>Check that you are using the Apple Account that received the invitation and that you accepted both invitations when an Activity needs Project access. Ask the owner for a current Activity invitation if the Activity has just started.</p><p>Ending an Activity removes existing collaborators’ access. The owner can share its history again with view-only permissions.</p><p>If you can read work but cannot change it, check both its current state and your invitation’s edit permission. Project edit access covers Locations and Item definitions; Activity edit access covers that Activity’s allowed work. Only the Project owner can create Activities or change their state.</p></article></noscript><div id="app"></div><!-- site-footer -->
