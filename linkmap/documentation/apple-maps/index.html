<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Apple Maps</li></ul><p>Article</p><h1>Apple Maps</h1><p>LinkMap uses Apple’s map services to show geographic context and help you find places.</p></section><h2>Your Project on the map</h2><p>Your Project Locations appear as markers on the map. On iOS, selecting an Activity adds its Routes, and selecting an Assignment focuses the view on that team’s work. See <a href="../map/index.html">Map</a> and <a href="../locations/index.html">Locations</a> for working with your Project’s places.</p><h2>Find places on the web</h2><p>Search for a place or address to move the map to a result and inspect its details when available. You can also show a latitude and longitude pair and copy the coordinates. These web tools work without signing in; viewing your own or shared Projects requires your Apple Account.</p><p>See <a href="../web-platform/index.html">LinkMap for Web</a> for the web tools and <a href="../ios-platform/index.html">LinkMap for iOS</a> for creating and editing Project Locations.</p><h2>Map services and privacy</h2><p>Map display and place search may send requests to Apple. See the <a href="https://endsunset.github.io/linkmap/privacy-policy/">privacy policy</a> for how map-related information is handled.</p></article></noscript><div id="app"></div><!-- site-footer -->
