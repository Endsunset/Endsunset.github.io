<header class="endsunset-header" data-nav-state="closed">
  <nav class="endsunset-nav endsunset-shell" aria-label="Main navigation">
    <a class="endsunset-brand" href="/" aria-label="Endsunset home">Endsunset</a>
    <div class="endsunset-controls">
      <div class="endsunset-projects">
        <a href="/projects/">Projects</a>
        <button class="endsunset-projects-toggle" type="button" aria-label="Show projects menu" aria-expanded="false" aria-controls="endsunset-project-menu" hidden><span aria-hidden="true">⌄</span></button>
