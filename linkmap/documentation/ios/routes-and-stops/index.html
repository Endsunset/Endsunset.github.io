<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Routes and Stops</li></ul><p>Article</p><h1>Routes and Stops</h1><p>Put the places to visit in order for an Activity.</p></section><h2>Overview</h2><p>Each Stop uses a Location from the Project. Prepare Routes while the Activity is in Planning and you have permission to edit it.</p><h2>Create a Route</h2><ol><li><p>Open the Planning Activity, then Routes.</p></li><li><p>Tap Add Route.</p></li><li><p>Select Locations on the map, then tap Next.</p></li><li><p>Enter a Route name.</p></li><li><p>Tap Edit to rearrange Location Order.</p></li><li><p>Tap Save.</p></li></ol><p>Tap Select Locations if you need to change the selection before saving. Tap Cancel to discard the Route edit.</p><p>To change an existing Planning Route, open it, choose More → Edit, change its selected Locations or name, and use Edit to rearrange Location Order before saving. Active and Ended Routes keep their saved plan.</p><h2>Choose available Locations</h2><p>During selection, red Locations are available, blue Locations are selected, and grey Locations are unavailable. Tap a selected Location to remove it from the selection.</p><p>A Location already used by another Route in the same Activity remains visible in grey and cannot be selected. A Location can appear only once in a Route.</p><h2>Give a Route to a team</h2><p>Create an Assignment and choose its Routes. A Route can belong to one Assignment. See <a href="../assignments/index.html">Assignments</a>.</p><h2>Follow a Route</h2><p>In an active Activity, open Assignments, choose your Assignment, then open Routes and choose a Route. Read its Stops in order and tap Location markers to see place details on the map.</p><p>Starting the Activity locks its planned Routes and Assignments. Complete any changes to the plan before starting; see <a href="../activities/index.html">Activities</a>.</p><h2>Record service at a Stop</h2><p>You need edit access to an Active Activity. Open a Route belonging to an Assignment; resource deliveries use that Assignment’s available Items.</p><ol><li><p>Find the Stop in the Route’s ordered list.</p></li><li><p>Tap its saved Served number. The field shows the saved total plus a change.</p></li><li><p>Enter the amount to add. Use the keyboard’s + or − control to choose a positive or negative change.</p></li><li><p>Check the preview, including changes to Item quantities, then tap Done.</p></li><li><p>Wait for confirmation. The display changes from total ± change to the saved total.</p></li></ol><p>Enter a change, not a replacement total. If Served is 3 and two more people were served, enter +2 to reach 5. To correct 5 back to 4, enter −1. A correction cannot make the final Served count negative.</p><h2>Record or correct Item deliveries</h2><ol><li><p>Expand Item Quantities using the Stop’s chevron.</p></li><li><p>Review each Item’s saved quantity and the pending changes. A Served change also proposes a change for each Item, limited by the available resources; check it against the actual delivery.</p></li><li><p>To adjust an individual Item, tap its quantity, enter the amount to add or subtract, and tap Done.</p></li><li><p>Wait for confirmation before editing another field or leaving the Route.</p></li></ol><p>For example, if the Stop has received 4 Water bottles, +2 makes its saved delivery 6; −2 changes it to 2. Reducing a delivery releases that quantity back to the Assignment. No Resources means there are no Item rows available in this context; record Supply and allocate Items first using <a href="../item-transfers/index.html">Item Transfers</a>.</p><h2>Understand automatic saving</h2><p>Done, moving focus away from the field, dismissing the keyboard, or leaving the view submits the current change. There is no separate Route Save button. Only one field can be edited at a time. Back, Projects, Close, and Route changes are unavailable while an edit, save, or failure needs resolution.</p><p>If saving fails, the change stays visible with Retry and Discard. Correct an invalid quantity or shortage, then Retry, or Discard to return to the confirmed values. If refreshed balances reduce what can be delivered, review the retained edit before trying again. Retry keeps the intended total and does not add the change twice.</p><p>Resolve pending edits before closing the app; they are not retained across a relaunch. If the Activity has ended or your edit permission has been removed, further updates cannot be saved.</p><h2>Review a finished Route</h2><p>In an Ended Activity, open an Assignment and Route to read People Served, service progress, Item deliveries, Stop Distribution, and saved Stop details. Expand a Stop to inspect its Item quantities and available history links. These results are read-only; see <a href="../results-and-reports/index.html">Results and Reports</a>.</p></article></noscript><div id="app"></div><!-- site-footer -->
