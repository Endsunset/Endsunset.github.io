<!-- End shared header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>LinkMap for iOS</li></ul><p>Article</p><h1>LinkMap for iOS</h1><p>Set up LinkMap on your device and start organizing places and shared work.</p></section><h2>Get ready to use LinkMap</h2><p>Install LinkMap on your device, then open it. Make sure your device is signed in to your Apple Account in Settings and has access to iCloud. LinkMap uses that account for your Projects; you do not need to sign in separately inside the app.</p><p>Use the iOS app to create and manage Projects, add Locations, plan Activities and Routes, and share a Project with collaborators.</p><h3>Create or choose a Project</h3><p>The app opens on the Map. Open Dashboard to choose what you are working on.</p><ol><li><p>To start a new Project, choose Dashboard → Add Project and give it a name.</p></li><li><p>Open Dashboard → Context and select the Project you want to use.</p></li><li><p>Open Dashboard → Current Project to see and manage its details.</p></li></ol><p>If someone has invited you to a Project, open their invitation or use Dashboard → Scan to scan its QR code. After joining, select the shared Project in Context.</p><h3>Add your first places</h3><p>Use the Map toolbar’s Edit Locations action to add or move places. Save to keep your changes or Cancel to discard them. Tap a Location marker and choose Detail to learn more about it.</p><p>You can start with a simple Project map. Add Regions and Layers when you need to organize separate areas or levels. See <a href="../project/index.html">Project</a> and <a href="../map/index.html">Map</a> for more guidance.</p><h3>Plan your first visit</h3><p>When you are ready to plan work, create an Activity in your Project. Add a Route using your Locations as Stops, then create an Assignment for the person or team following it.</p><p>In Dashboard → Context, select the Activity and, if needed, an Assignment. Return to the Map to see the route and focus on that team’s work. Archive the Activity when the work is over; your Project and its places remain available for another visit.</p><p>Follow <a href="../basic-workflow/index.html">Basic Workflow Example</a> for a guided example, or see <a href="../sharing/index.html">Sharing</a> to invite collaborators.</p></article></noscript><div id="app"></div><!-- Shared footer: edit components/footer.html, then run scripts/build-footers.py -->
