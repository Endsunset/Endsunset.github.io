<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Results and Reports</li></ul><p>Article</p><h1>Results and Reports</h1><p>Review saved service and Item deliveries, then prepare an Assignment report.</p></section><h2>Check work in progress</h2><ol><li><p>Open the active Activity from the Project’s Activities list.</p></li><li><p>Read Overview for People Served, Stops with Service, and Routes with Service.</p></li><li><p>Open an Assignment for its summary, Resources, and Item Transfer History.</p></li><li><p>Open one of its Routes for Stop progress and field updates.</p></li></ol><p>Summaries use saved changes. Finish any Stop edit and wait for confirmation before relying on a count or generating a report. See <a href="../routes-and-stops/index.html">Routes and Stops</a> for recording service and deliveries.</p><h2>Review an Ended Activity</h2><ol><li><p>Open Activities and select the Activity under Ended.</p></li><li><p>Read Usage Overview and its Assignment Distribution, Route Distribution, and Item Composition sections.</p></li><li><p>Open an Assignment, Route, or Stop to inspect its saved results and available history links.</p></li></ol><p>Ended records are read-only. Sharing their history requires a new view-only invitation from the owner; see <a href="../sharing/index.html">Sharing</a>.</p><p>In Usage Overview, choose Usage / Total or Percentage. Item usage compares outgoing quantity with incoming quantity at that record. Assignment and Route distribution graphs show deliveries at Stops; an allocation to a team is not itself a delivery.</p><p>Choose People Served or an Item as the graph measure, and Bar or Pie for its display. Item Composition can compare Input to the Activity with Output delivered to Stops. Expand Breakdown, where available, to read individual quantities.</p><p>Unavailable means a ratio has no valid total to divide by. No Data Available means the selected graph has no eligible data; a Pie requires positive values. A loading indicator or Unable to Load Overview with Retry means the results have not loaded successfully, so do not interpret it as zero work.</p><h2>Preview and share an Assignment report</h2><p>Reports are available from active and ended Assignment details.</p><ol><li><p>Open the Activity, then Assignments, and choose an Assignment.</p></li><li><p>Tap Preview Report, or Report when using an Assignment resource screen.</p></li><li><p>Wait for the generated text and check the Routes, served counts, and distributed Items.</p></li><li><p>Tap Refresh if saved work or report settings have changed.</p></li><li><p>Tap Copy to copy the text, or Share to choose an app or destination.</p></li></ol><p>Copying or sharing a report sends its text. Use Project and Activity invitations when someone needs access to the work itself.</p><h2>Set report presentation</h2><ol><li><p>In the report, open Report Settings. You can also open Projects → Settings → Report Style.</p></li><li><p>Use Headers and Footers to add personal templates. Tap Add Template, enter the text, and Save; select the template you want to use. Use Edit to manage existing templates.</p></li><li><p>Set Section Separator, Name and Served Separator, and Language.</p></li><li><p>Choose whether to include Served on Route Line and Use Order for numbered Stops.</p></li><li><p>Open Preview to check the style, then refresh the Assignment report to apply it to current work.</p></li></ol><p>Selected templates apply to reports generated for your own iCloud account. Changing their presentation does not change saved service or Item quantities.</p></article></noscript><div id="app"></div><!-- site-footer -->
