<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for Web</a></li><li>Locations</li></ul><p>Article</p><h1>Locations</h1><p>Inspect a Location’s saved description, map position, and related places.</p></section><h2>Open a Location</h2><ol><li><p>Choose Project and select your Project.</p></li><li><p>Under Browse project, choose Locations.</p></li><li><p>Choose a Location to open its details.</p></li></ol><p>You can also select a ground-level Location marker on the map. Opening another marker replaces the current details. Back returns through details you opened from a list or related record; Close details dismisses the panel.</p><h2>Read saved details</h2><p>The heading shows the saved Location name. Details include:</p><ul><li><p><b>About:</b> The saved description, when present.</p></li><li><p><b>Project:</b> The Project the Location belongs to.</p></li><li><p><b>Latitude and Longitude:</b> The saved coordinate, when valid.</p></li><li><p><b>Area vertices:</b> The number of saved points defining the Location’s area.</p></li><li><p><b>Region and Layer:</b> Links to related records, when available, including the Layer’s level.</p></li></ul><p>These are your Project’s saved details. Apple Maps place information is shown separately in Search and does not replace the saved description or coordinate.</p><h2>Find it on the map</h2><p>Choose Show on map to center on the saved coordinate. Choose Directions to open Apple Maps directions to that coordinate in a new tab.</p><p>A Location without a valid coordinate remains in the Project list and displays This Location has no valid map coordinate. Show on map and Directions are unavailable for that Location. Correct its position in LinkMap for iOS, then use Project → Refresh map data.</p><p>Locations on higher or lower Layers can be inspected from lists. Show on map centers on their coordinate, but the map continues displaying ground-level content. See <a href="../regions-and-layers/index.html">Regions and Layers</a>.</p><h2>Change a Location</h2><p>Use LinkMap for iOS to change the name, description, position, area, Region, or Layer. The web details are read-only, even when your Project permissions allow editing in iOS.</p></article></noscript><div id="app"></div><!-- site-footer -->
