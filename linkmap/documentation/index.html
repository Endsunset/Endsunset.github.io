<!-- /site-header --><noscript><article><section><ul><li>LinkMap</li></ul><p>LinkMap Guide</p><h1>LinkMap</h1><p>Learn how to organize places and work in LinkMap on iOS and the web.</p></section><h2>Overview</h2><p>Start with Essentials, explore the core concepts, or choose your platform guide. Learn about sharing under Collaboration and the services LinkMap uses under Services.</p><h2>Topics</h2><h3>Essentials</h3><ul><li><a href="how-linkmap-works/index.html"><p>How LinkMap Works</p></a><p>Bring places, routes, and shared work together on a map.</p></li><li><a href="basic-workflow/index.html"><p>Basic Workflow</p></a><p>Follow one Project from a first place to a planned visit.</p></li></ul><h3>Concepts</h3><ul><li><a href="project/index.html"><p>Project</p></a><p>A Project brings together the places and activities for one area or shared effort.</p></li><li><a href="map/index.html"><p>Map</p></a><p>The Map is the first screen in LinkMap. It stays visible even before you choose a Project.</p></li><li><a href="activities/index.html"><p>Activities</p></a><p>An Activity is one round of work within a Project.</p></li><li><a href="assignments/index.html"><p>Assignments</p></a><p>An Assignment names the person, team, crew, or vehicle responsible for work in an Activity.</p></li><li><a href="locations/index.html"><p>Locations</p></a><p>Locations are the places your team needs to find or visit, such as entrances, rooms, checkpoints, or delivery points.</p></li><li><a href="routes-and-stops/index.html"><p>Routes and Stops</p></a><p>A Route puts places in the order your team should visit them. Each Stop uses a Location from the Project.</p></li><li><a href="regions-and-layers/index.html"><p>Regions and Layers</p></a><p>Regions divide a Project into broad areas. Layers describe levels or surfaces inside a Region, such as floors in a building.</p></li></ul><h3>Platforms</h3><ul><li><a href="ios-platform/index.html"><p>LinkMap for iOS</p></a><p>Set up LinkMap on your device and start organizing places and shared work.</p></li><li><a href="web-platform/index.html"><p>LinkMap for Web</p></a><p>Open LinkMap in a browser to explore places and view your Project map.</p></li></ul><h3>Collaboration</h3><ul><li><a href="sharing/index.html"><p>Sharing</p></a><p>Share a Project when other people need to see and work with the same places and Activities.</p></li></ul><h3>Services</h3><ul><li><a href="icloud/index.html"><p>iCloud</p></a><p>iCloud stores your LinkMap Projects and makes them available through your Apple Account.</p></li><li><a href="apple-maps/index.html"><p>Apple Maps</p></a><p>LinkMap uses Apple’s map services to show geographic context and help you find places.</p></li></ul></article></noscript><div id="app"></div><!-- site-footer -->
