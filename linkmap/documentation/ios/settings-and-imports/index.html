<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Settings and Imports</li></ul><p>Article</p><h1>Settings and Imports</h1><p>Manage report preferences and caches, or bring Locations from an existing LinkMap document into a Project.</p></section><h2>Open Settings</h2><ol><li><p>Tap Projects at the upper left of the map.</p></li><li><p>Tap Settings (the gear button).</p></li><li><p>Choose Cache, Report Style, Import, Documentation, or Credits.</p></li><li><p>Use Close Settings to return to Projects when you finish.</p></li></ol><p>See <a href="../results-and-reports/index.html">Results and Reports</a> for report templates, separators, language, and preview controls.</p><h2>Import Locations</h2><p>Import reads Locations from a compatible LinkMap document. It does not restore a complete Project with Activities, Items, or transfer history.</p><ol><li><p>Create or join the destination Project first, and make sure you can edit it.</p></li><li><p>Open Settings and tap Import to open the document browser.</p></li><li><p>Choose the LinkMap document containing the places you want to bring in.</p></li><li><p>When Upload Locations appears, choose the destination Project. This uploads the locally imported Locations to that Project. Tap Skip if you do not want to upload them now.</p></li><li><p>Open the Project and check its Locations on the map.</p></li></ol><p>The upload creates new Project Locations. If an upload fails partway through, inspect the destination before trying again so you can identify places already added. An empty document provides no Locations to upload. Create or join a Project if the destination list is empty.</p><p>LinkMap can also open ZIP documents for extraction. Opening an archive alone does not import its contents as Project data; open the compatible LinkMap document inside when importing Locations.</p><h2>Clean caches</h2><ol><li><p>Open Settings → Cache and check Cache Size.</p></li><li><p>Choose Clean App Cache or Clean Cloud Cache for that cache, or Clean All Cache for all cached files.</p></li><li><p>For Clean All Cache, review the confirmation and tap Clean to continue, or Cancel to keep the files.</p></li></ol><p>Cache cleanup cannot be undone. Finish pending work first. Use the Project and sharing controls to manage saved data and access; cache cleanup is not a way to leave a shared Project. See <a href="../project/index.html">Project</a> and <a href="../icloud/index.html">iCloud</a>.</p><h2>Get help</h2><p>Documentation opens this guide. Credits lists acknowledgements. If information fails to load or save, follow the app’s error message and the recovery steps in <a href="../icloud/index.html">iCloud</a> before repeating the action.</p></article></noscript><div id="app"></div><!-- site-footer -->
