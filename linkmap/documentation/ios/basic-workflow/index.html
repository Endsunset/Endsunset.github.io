<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Basic Workflow</li></ul><p>Article</p><h1>Basic Workflow</h1><p>Create a small Project, plan a visit, and record service and deliveries in LinkMap for iOS.</p></section><h2>Create a Project and add places</h2><ol><li><p>Tap Projects at the upper left of the map.</p></li><li><p>Tap the Project Actions button (the ellipsis), then Add Project.</p></li><li><p>Enter a name and tap Save.</p></li><li><p>In the Project’s Console, tap More, then Edit Map.</p></li><li><p>Tap Add, choose Location, then tap the map to place it.</p></li><li><p>Enter a name and any details, then tap Done. Repeat for the other places you need.</p></li><li><p>Tap Save in the map toolbar to save the Project map.</p></li></ol><p>See <a href="../locations/index.html">Locations</a> to move a place or change its details.</p><h2>Prepare the visit</h2><ol><li><p>Open Activities from your Project.</p></li><li><p>Tap Activity Actions (the ellipsis), then Add Activity. Enter a name, leave Copy set to None, and tap Save.</p></li><li><p>Open Routes and tap Add Route. Select the places to visit on the map, then tap Next.</p></li><li><p>Name the Route. Tap Edit to arrange Location Order, then tap Save.</p></li><li><p>Open Assignments, tap the plus button, enter a name, and select the Route. Tap Save.</p></li></ol><p>You can add more Routes and Assignments before starting. See <a href="../activities/index.html">Activities</a> to reuse a previous plan.</p><h2>Start and follow the work</h2><p>The Project owner opens the Activity’s More menu, taps Start, and confirms. Starting locks the plan and revokes existing Activity sharing. If you are working with others, use Start Sharing to create and send a new Activity invitation after starting; see <a href="../sharing/index.html">Sharing</a>.</p><p>In the active Activity, open Assignments, choose your Assignment, then open Routes and choose a Route. The map follows the work you open in the Console.</p><h2>Add and deliver Items</h2><p>If your visit uses resources:</p><ol><li><p>Open Project → Items → Add Item. Enter a clear name, then Save and confirm Save Anyway after reviewing the permanent name. See <a href="../items/index.html">Items</a>.</p></li><li><p>Open the active Activity → Record Item Transfers → New Record.</p></li><li><p>Select the Item, choose Supply, enter the quantity received, and tap Add.</p></li><li><p>Add a Transfer row for the Item, select your Assignment, and enter the quantity it receives.</p></li><li><p>Tap Review, check From, To, and quantities, then Save. See <a href="../item-transfers/index.html">Item Transfers</a>.</p></li><li><p>Open Assignment → Routes and choose the Route. At a Stop, tap its Served number and enter the change, then Done. Expand Item Quantities to inspect or adjust deliveries. Wait for the saved totals. See <a href="../routes-and-stops/index.html">Routes and Stops</a>.</p></li></ol><p>You can record Served even when the visit has no Items. Served is a change to the existing count, so entering 2 at a saved count of 3 records a total of 5.</p><h2>Finish and review</h2><ol><li><p>Finish Route edits and wait for automatic save confirmation.</p></li><li><p>Check remaining Resources and record any needed returns from Assignments.</p></li><li><p>Open an Assignment’s Preview Report to copy or share its saved work.</p></li><li><p>The owner opens the Activity’s More menu, taps End Activity, and confirms End.</p></li><li><p>Open the Ended Activity to review its results and graphs; see <a href="../results-and-reports/index.html">Results and Reports</a>.</p></li></ol><p>Ending preserves the history and revokes current Activity sharing. It cannot be undone. The owner can share the ended history again with view-only permissions.</p></article></noscript><div id="app"></div><!-- site-footer -->
