<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li><a href="../ios-platform/index.html">LinkMap for iOS</a></li><li>How LinkMap Works</li></ul><p>Article</p><h1>How LinkMap Works</h1><p>Bring places, routes, and shared work together on a map.</p></section><h2>Keep your places together</h2><p>A Project holds the places for an area or shared effort. Add a Location for each entrance, room, checkpoint, or delivery point your team needs to find. Use Regions to group places and Layers to organize levels, such as floors in a building.</p><p>Your Project map stays available for future visits. You can plan another round of work using the same Locations.</p><h2>Plan a visit</h2><p>An Activity is one round of work in a Project. A Route puts Locations in visit order; each visit is a Stop. An Assignment groups the Routes for a person or team.</p><p>For example, keep a building’s delivery points in one Project. Create an Activity for today’s deliveries, arrange the Stops into Routes, and give each team an Assignment.</p><p>Activities move through three states:</p><ul><li><p><b>Planning:</b> Prepare the Routes and Assignments.</p></li><li><p><b>Active:</b> Follow the plan. Its Routes and Assignments are locked.</p></li><li><p><b>Ended:</b> Review the work. The Activity is read-only.</p></li></ul><p>See <a href="../basic-workflow/index.html">Basic Workflow</a> to try this in the iOS app.</p><h2>Work with other people</h2><p>Share a Project so collaborators can access its map. Share an Activity separately when they also need access to that work. Each invitation has its own permissions. See <a href="../sharing/index.html">Sharing</a>.</p><p>LinkMap uses your Apple Account and iCloud for your Projects. This guide describes LinkMap for iOS; see <a href="../web-platform/index.html">LinkMap for Web</a> for the Web App’s development status.</p></article></noscript><div id="app"></div><!-- site-footer -->
