<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for Web</a></li><li>iCloud</li></ul><p>Article</p><h1>iCloud</h1><p>Sign in to view your private and accepted shared Projects in the web app.</p></section><h2>Sign in with your Apple Account</h2><ol><li><p><a href="https://endsunset.github.io/linkmap/app/">Open the Web App</a> and choose Project.</p></li><li><p>Choose Sign in when it appears.</p></li><li><p>Complete Apple’s sign-in using the Apple Account you use for LinkMap. Apple handles your credentials.</p></li><li><p>When you return to the map, wait for your Projects to load.</p></li></ol><p>Web sign-in is separate from the account signed in on your iPhone or iPad. Search Maps remains available without signing in to iCloud.</p><p>Your account must have access to a Project to load it. Accept Project invitations in LinkMap for iOS before opening the shared Project on the web. Sharing and editing permissions are managed in iOS; all web Project viewing is read-only.</p><h2>Refresh saved information</h2><ol><li><p>Finish saving your changes in LinkMap for iOS.</p></li><li><p>In the web app, choose Project and select the Project you want to update.</p></li><li><p>Choose Refresh map data and wait for the records to finish loading before opening details.</p></li></ol><p>Refresh map data reloads the selected Project’s Locations, Regions, Layers, and Items. To update the Projects list after creating a Project or accepting an invitation, reload the page. Refreshing or changing Projects closes the open Project details.</p><h2>If a Project is missing</h2><p>Check that you signed in with the same Apple Account used for LinkMap, clear Find a project, and reload the page. If the list is empty, create a Project or accept a Project share in the iOS app first.</p><p>For a shared Project, check with its owner that your access is still available. An Activity invitation is separate from Project access; the web app does not display Activities.</p><h2>Recover a failed load</h2><ol><li><p>Read the displayed error and check your internet connection.</p></li><li><p>Choose Try again in the Project panel when available. It retries the connection, Project list, or selected Project load that failed.</p></li><li><p>If signing in fails, use Try again on the sign-in page. Account also offers Retry sign-in check when the account check fails.</p></li><li><p>Reload the page if the problem continues, then check your account and Project access in iOS.</p></li></ol><p>A failed Project load is not an empty Project. The web app clears the previous Project’s map and details while loading and shows a retry state if it cannot load the records. There are no web edits or save drafts to recover. Reopen the Project’s details after a successful load.</p><h2>Manage your session</h2><p>While signed in, choose Project → Account to check your Apple Account session and use Apple’s sign-out control. Use Back to LinkMap to return to the map.</p><p>Signing out removes Project access from the web view. To manage or delete Project data, use LinkMap for iOS. See the <a href="https://endsunset.github.io/linkmap/privacy-policy/">privacy policy</a> for storage, sharing, and deletion details.</p></article></noscript><div id="app"></div><!-- site-footer -->
