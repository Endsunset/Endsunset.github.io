<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for Web</a></li><li>Map</li></ul><p>Article</p><h1>Map</h1><p>Search Apple Maps and explore saved Project places without changing them.</p></section><h2>Find a place or address</h2><ol><li><p>Choose Search in the sidebar.</p></li><li><p>Enter a place name or address in Search Maps.</p></li><li><p>Choose a suggestion to open the first matching place. To see a list of results instead, press Enter or choose the Search Maps button.</p></li><li><p>Choose a result to show it on the map and open Place details.</p></li></ol><p>Search works without signing in to iCloud and looks for Apple Maps places, rather than saved Project records. To find a saved Location, use Project → Locations. Selecting a search result does not save a Location.</p><p>You can also select an Apple Maps place directly on the map to open its details. Opening an Apple Maps place reveals Search and closes any Project detail panel. Changing Projects leaves your selected Apple Maps place available.</p><h2>Explore the Project map</h2><ol><li><p>Choose Project and select a Project.</p></li><li><p>Wait for its records to load. The map displays the available ground-level places.</p></li><li><p>Pan or zoom to explore, then select a Location marker to open its saved details.</p></li></ol><p>Saved Location areas appear as outlines where available. The map stays at level 0: it shows Locations without a Layer and Locations in level-zero Layers. Higher and lower levels remain available in lists, but opening a Location or Layer does not change the displayed level. See <a href="../regions-and-layers/index.html">Regions and Layers</a>.</p><h2>Make room for the map</h2><p>Search and Project each open a panel over the map. Choose the active sidebar button again to close its panel, or choose the other button to switch panels. Collapse sidebar reduces navigation to icons; Expand sidebar restores the labels. Help remains available and opens the web guide in a new tab.</p><p>On a wide screen, Project details open beside the sidebar. On narrower screens they use the panel space, and on phones they appear at the bottom of the map. Close details when you want more map space.</p><h2>If search or maps cannot load</h2><p>Keep JavaScript enabled and check your internet connection. Wait for Apple Maps to finish loading before searching. If Search unavailable appears, try the search again. If additional place details are unavailable, select the result again to retry.</p><p>Reload the page if the map still cannot load. For Project-loading problems, see <a href="../icloud/index.html">iCloud</a>.</p></article></noscript><div id="app"></div><!-- site-footer -->
