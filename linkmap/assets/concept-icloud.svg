<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Connected, with distinct access</title><desc id="desc">An owner’s iCloud connects a Project and Activity with separate invitation groups.</desc>
<view id="invitations" viewBox="20 350 680 360"/>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#dedfe2" stroke-width="1"/></pattern></defs>
<style>text{font-family:system-ui,sans-serif;fill:#202124;font-size:22px}.small{font-size:18px;fill:#5f6368}.accent{fill:#b4232c}.line{stroke:#dedfe2;stroke-width:2}.path{stroke:#b4232c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.panel{fill:white;stroke:#dedfe2;stroke-width:2}</style>

<circle cx="360" cy="240" r="180" stroke="#dedfe2" stroke-dasharray="4 10"/>
<circle cx="360" cy="240" r="140" stroke="#dedfe2"/>
<path d="M280 230c-50 0-55-75-10-90 0-68 106-82 125-18 62-13 88 77 36 104Z" fill="white" stroke="#b4232c" stroke-width="3"/>
<text x="360" y="183" text-anchor="middle">iCloud</text><text x="360" y="280" text-anchor="middle" class="small">OWNER’S ACCOUNT</text>
<path d="M360 310v65H175v65 M360 375h185v65" class="path"/>
<rect x="60" y="440" width="230" height="80" rx="4" class="panel"/><text x="175" y="488" text-anchor="middle">Project</text>
<rect x="430" y="440" width="230" height="80" rx="4" class="panel"/><text x="545" y="488" text-anchor="middle">Activity</text>
<path d="M175 520v45H100v30 M175 565h75v30 M545 520v45H470v30 M545 565h75v30" class="line"/>
<g fill="white" stroke="#b4232c" stroke-width="2"><circle cx="100" cy="610" r="18"/><circle cx="250" cy="610" r="18"/><circle cx="470" cy="610" r="18"/><circle cx="620" cy="610" r="18"/></g>
<text x="175" y="660" text-anchor="middle" class="small">Project invitation</text><text x="545" y="660" text-anchor="middle" class="small">Activity invitation</text>
<path d="M360 430v250" class="line" stroke-dasharray="4 10"/>
<text x="360" y="40" text-anchor="middle" class="small">YOUR DATA. YOUR CONNECTIONS.</text>
</svg>