<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Items</li></ul><p>Article</p><h1>Items</h1><p>Define the resources your team supplies and distributes during Activities.</p></section><h2>Overview</h2><p>An Item is a reusable name in a Project, such as Water bottle or Meal pack. Creating an Item does not add stock. Record Supply in an active Activity to add a quantity, then transfer it to an Assignment for delivery. See <a href="../item-transfers/index.html">Item Transfers</a>.</p><h2>Create an Item</h2><p>You need permission to edit the Project. Item definitions remain available across its Activities, regardless of Activity state.</p><ol><li><p>Open the Project in the Console, then tap Items.</p></li><li><p>Tap Add Item (the plus button).</p></li><li><p>Enter the Item name. Use a name that makes its counting unit clear, such as Water bottle rather than Water.</p></li><li><p>Tap Save and review Save Item Permanently?.</p></li><li><p>Check the name, then tap Save Anyway to create it, or Cancel to return to the draft.</p></li></ol><p>Saved Item fields cannot be edited. Check spelling and units before confirming. An empty name uses the app’s New Item fallback.</p><h2>View an Item</h2><p>Open Project → Items and select an Item to read its saved name. Quantities belong to Activities and Assignments; the Items list is the Project’s catalog of definitions.</p><h2>Use Items in an Activity</h2><ol><li><p>Prepare the Activity’s Routes and Assignments while it is in Planning.</p></li><li><p>Ask the Project owner to start the Activity.</p></li><li><p>Open the active Activity and tap Record Item Transfers to record Supply and allocations.</p></li><li><p>Open an Assignment to check its Resources, record returns or transfers, and follow its Routes to distribute Items at Stops.</p></li></ol><p>Resource entry and Stop distribution require edit access to the active Activity. Creating an Item requires Project edit access; these permissions are separate. See <a href="../sharing/index.html">Sharing</a>.</p><h2>If no Items or resources appear</h2><p>No Items means the Project has no loaded Item definitions. Ask someone with Project edit access to create them. No Resources at an Activity or Assignment can mean no quantity has been recorded there yet. Supply goes to the Activity before it is transferred to an Assignment.</p></article></noscript><div id="app"></div><!-- site-footer -->
