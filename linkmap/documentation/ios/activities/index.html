<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Activities</li></ul><p>Article</p><h1>Activities</h1><p>Plan one round of work, follow it, and keep its history.</p></section><h2>Create an Activity</h2><p>Only the Project owner can create an Activity.</p><ol><li><p>Open your Project, then Activities.</p></li><li><p>Tap Activity Actions (the ellipsis), then Add Activity.</p></li><li><p>Enter a name. Leave Copy set to None to start with an empty plan.</p></li><li><p>Tap Save.</p></li></ol><p>The Activity begins in Planning. Add <a href="../routes-and-stops/index.html">Routes and Stops</a> and <a href="../assignments/index.html">Assignments</a> before starting. In a Planning Activity, open More → Edit to change its name, then Save.</p><h2>Know what each state allows</h2><table><thead><tr><th>State</th><th>Plan</th><th>Item transfers and Stop updates</th><th>Review</th></tr></thead><tbody><tr><td>Planning</td><td>Edit the name, Routes, Stop order, and Assignments with Activity edit access.</td><td>Unavailable.</td><td>Read the planned work.</td></tr><tr><td>Active</td><td>Locked.</td><td>Available with Activity edit access.</td><td>Read saved progress, resources, history, and reports.</td></tr><tr><td>Ended</td><td>Read-only.</td><td>Read-only.</td><td>Read final results, graphs, history, and reports.</td></tr></tbody></table><p>Only the Project owner can create, start, or end an Activity. The state moves forward from Planning to Active to Ended and cannot move backward. A Project can have several Planning or Active Activities at once. Project-owned Locations and Item definitions remain independent of these state locks.</p><h2>Reuse an earlier plan</h2><p>When creating a new Activity, use Copy to choose what to bring from a Source Activity in the same Project:</p><ul><li><p><b>None:</b> Start without Routes or Assignments.</p></li><li><p><b>All Routes:</b> Copy the Routes and Stop order, leaving the Routes unassigned.</p></li><li><p><b>All Routes and Assignments:</b> Also copy the Assignments and their Route connections.</p></li></ul><p>You can choose a Source Activity in any state. Copied Stops start with Served set to zero; Supply, transfers, and delivery quantities are not copied. Copy is available when creating an Activity. If the source cannot be copied, correct the problem shown by the app or create without copying.</p><h2>Start an Activity</h2><p>While the Activity is in Planning, check its Routes and Assignments. The owner can then open More, tap Start, and confirm Start.</p><p>Starting cannot be undone. It locks the Activity name, planned Routes, Stop order, and Assignments, and revokes the Activity’s current sharing invitation. It does not create a replacement invitation. The owner must use Start Sharing and invite people to the active Activity again; see <a href="../sharing/index.html">Sharing</a>.</p><h2>Open active work</h2><p>Open the active Activity, tap Assignments, and choose an Assignment. Tap Routes and choose a Route to see its Stops. The map follows the work open in the Console.</p><p>Use Record Item Transfers on the Activity to record Supply and allocate Items to teams. Use the same action on an Assignment for returns or transfers to another team. See <a href="../item-transfers/index.html">Item Transfers</a>. At a Route, record Served and Item quantities at its Stops; see <a href="../routes-and-stops/index.html">Routes and Stops</a>.</p><h2>End an Activity</h2><p>Finish each Route edit and wait for its automatic save to be confirmed. Check remaining Activity and Assignment resources and record any returns or transfers needed. Nonzero balances do not prevent ending, but you cannot change them afterward.</p><p>In the active Activity, the owner taps More, then End Activity, reviews the reminder, and confirms End.</p><p>Ending cannot be undone. The Activity becomes read-only, its history is preserved, and existing collaborators lose access to that Activity. The Project and its Locations remain available for your next Activity.</p><p>Use Start Sharing to give people new view-only access to the ended history. See <a href="../results-and-reports/index.html">Results and Reports</a> to review final results.</p></article></noscript><div id="app"></div><!-- site-footer -->
