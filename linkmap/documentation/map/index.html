<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Map</li></ul><p>LinkMap Guide</p><h1>Map</h1><p>The Map is the first screen in LinkMap. It stays visible even before you choose a Project.</p></section><h2>Overview</h2><p>Open Dashboard → Context to select a Project, Activity, and optional Assignment. The Map shows the selected Project’s Locations. Selecting an Activity adds its Routes; selecting an Assignment focuses the view on that team’s work.</p><p>Tap a Location marker to open its actions, then choose Detail. Use the Map toolbar’s Edit Locations action to add or move places. Save to keep changes or Cancel to discard them.</p><h2>Topics</h2><h3>Organize Places</h3><ul><li><a href="../locations/index.html"><p>Locations</p></a><p>Locations are the places your team needs to find or visit, such as entrances, rooms, checkpoints, or delivery points.</p></li></ul></article></noscript><div id="app"></div><!-- site-footer -->
