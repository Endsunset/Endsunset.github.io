<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>LinkMap for iOS</li></ul><p>API Collection</p><h1>LinkMap for iOS</h1><p>Keep your places together and plan the work around them.</p></section><h2>Get ready</h2><p>Open LinkMap on a device signed in to your Apple Account with iCloud available. LinkMap uses the account in Settings; there is no separate sign-in inside the app. See <a href="../icloud/index.html">iCloud</a> if your account is unavailable.</p><p>The app opens on the map. Tap the Projects button at the upper left to choose a Project. The Console sheet shows the Project or work you have open. Drag the sheet up to see more, or down to reveal the map.</p><h2>Start with a few places</h2><p>Create a Project, add the places you need, then plan a visit when you are ready. Follow <a href="../basic-workflow/index.html">Basic Workflow</a> for a first example, or choose a topic below for a particular task.</p><h2>Topics</h2><h3>Get started</h3><ul><li><a href="../how-linkmap-works/index.html"><p>How LinkMap Works</p></a><p>Bring places, routes, and shared work together on a map.</p></li><li><a href="../basic-workflow/index.html"><p>Basic Workflow</p></a><p>Create a small Project and plan your first visit in LinkMap for iOS.</p></li></ul><h3>Projects and places</h3><ul><li><a href="../project/index.html"><p>Project</p></a><p>Keep the places and Activities for one area together in a Project.</p></li><li><a href="../map/index.html"><p>Map</p></a><p>Find places and see the work you have open in the Console.</p></li><li><a href="../locations/index.html"><p>Locations</p></a><p>Save the places your team needs to find or visit.</p></li><li><a href="../regions-and-layers/index.html"><p>Regions and Layers</p></a><p>Group nearby places and organize levels within your Project.</p></li></ul><h3>Plan and follow work</h3><ul><li><a href="../activities/index.html"><p>Activities</p></a><p>Plan one round of work, follow it, and keep its history.</p></li><li><a href="../routes-and-stops/index.html"><p>Routes and Stops</p></a><p>Put the places to visit in order for an Activity.</p></li><li><a href="../assignments/index.html"><p>Assignments</p></a><p>Group the Routes for a person or team within an Activity.</p></li></ul><h3>Share and sync</h3><ul><li><a href="../sharing/index.html"><p>Sharing</p></a><p>Invite people to your Project map and the Activities they need.</p></li><li><a href="../icloud/index.html"><p>iCloud</p></a><p>Use your Apple Account to keep your LinkMap Projects available across your devices.</p></li><li><a href="../apple-maps/index.html"><p>Maps</p></a><p>Find places in LinkMap and open a maps app when you need directions.</p></li></ul></article></noscript><div id="app"></div><!-- site-footer -->
