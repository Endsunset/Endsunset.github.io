<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Maps</li></ul><p>Article</p><h1>Maps</h1><p>Find places in LinkMap and open a maps app when you need directions.</p></section><h2>Search the map</h2><p>Tap Search Maps, enter a place or address, then choose a suggestion. To save a place for your team, add it as a Project Location. See <a href="../locations/index.html">Locations</a>.</p><h2>Change the map’s appearance</h2><p>Use the Map Style button in the Console toolbar. When the Console shows a Back button, open More and choose Map Style. Choose Standard, Imagery, or Hybrid.</p><h2>Open a maps app</h2><ol><li><p>Tap a Location marker to open its details.</p></li><li><p>Open Navigation.</p></li><li><p>Choose Apple Map, Google Map, or Amap.</p></li></ol><p>LinkMap opens the selected service for that Location. Follow directions there. If Amap is unavailable, its App Store page opens so you can install it.</p><p>When comparing a place between map services, check that the destination marker is where you expect it to be.</p><h2>Map services and privacy</h2><p>LinkMap uses Apple’s map services for its map and place search. These actions may send requests to Apple. See the <a href="https://endsunset.github.io/linkmap/privacy-policy/">privacy policy</a> for details.</p></article></noscript><div id="app"></div><!-- site-footer -->
