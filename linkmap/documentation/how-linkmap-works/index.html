<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>How LinkMap Works</li></ul><p>Article</p><h1>How LinkMap Works</h1><p>Bring places, routes, and shared work together on a map.</p></section><h2>Overview</h2><p>LinkMap helps you keep track of where work needs to happen and who will do it. Use it to prepare visits, organize delivery points, or coordinate a team working across an area. You can start with a few places on a map and add a plan when you need one.</p><h3>Keep your places together</h3><p>Create a Project for an area or shared effort. Add Locations for the places that matter, such as entrances, rooms, checkpoints, or delivery points. The map helps you find each place again. If your area has distinct sections or levels, use Regions and Layers to organize it.</p><p>The Project is your lasting collection of places. You can reuse it whenever you plan another visit, instead of rebuilding the map each time.</p><h3>Plan a round of work</h3><p>Create an Activity for a particular visit or task. A Route puts the places to visit in order, with each place becoming a Stop. An Assignment identifies the person or team responsible for the work.</p><p>For example, a delivery team can keep its delivery points in one Project, create an Activity for today’s deliveries, and give each team a Route. On the map, choosing an Activity and Assignment helps a team focus on its own work. When the visit ends, archive the Activity and keep the places ready for next time.</p><h3>Work with other people</h3><p>Keep a Project private when you work alone, or invite collaborators when you need to work with the same places and plans. After accepting an invitation, collaborators can choose the shared Project in LinkMap.</p><p>Your Projects are stored in your iCloud account. Use the same Apple Account to access your available Projects on iOS and the web.</p><h3>Choose where to start</h3><p>Use LinkMap for iOS to create and manage Projects, add places, plan work, and invite collaborators. Use LinkMap for Web to view your Projects and Locations in a browser, search for places, and inspect coordinates. You can use the web search without signing in.</p><p>Start with <a href="../web-platform/index.html">LinkMap for Web</a> or <a href="../ios-platform/index.html">LinkMap for iOS</a>. For a step-by-step example of planning a visit in the iOS app, see <a href="../basic-workflow/index.html">Basic Workflow</a>.</p></article></noscript><div id="app"></div><!-- site-footer -->
