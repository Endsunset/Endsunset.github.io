<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Project</li></ul><p>Article</p><h1>Project</h1><p>Keep the places and Activities for one area together in a Project.</p></section><h2>Create a Project</h2><ol><li><p>Tap Projects at the upper left of the map.</p></li><li><p>Tap Project Actions (the ellipsis), then Add Project.</p></li><li><p>Enter a name, then tap Save.</p></li></ol><p>The Project opens in the Console. Add places with <a href="../locations/index.html">Locations</a>, or open Activities to plan work.</p><h2>Open another Project</h2><p>Tap Projects, then tap the Project you want to use. Enter a name in Search Projects to find it in the list.</p><p>The Console shows the open Project. Its Activities and Project Map give you access to its work and places.</p><h2>Change the Project name</h2><p>If you own the Project, open its More menu and tap Name. Enter the new name, then tap Save.</p><h2>Edit the Project map</h2><p>Open the Project’s More menu and tap Edit Map. You need permission to edit the Project. Add or change Locations, Regions, and Layers, then tap Save in the map toolbar. Tap Cancel there to discard the map editing session.</p><p>Project map changes also affect the places used by existing Activities. Review the Apply Changes prompt when editing an existing place.</p><h2>Share or delete a Project</h2><p>The owner’s More menu includes Share and Delete Project. See <a href="../sharing/index.html">Sharing</a> before inviting other people. To delete a Project, choose Delete Project and review the confirmation before continuing.</p></article></noscript><div id="app"></div><!-- site-footer -->
