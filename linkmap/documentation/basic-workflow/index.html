<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>Basic Workflow Example</li></ul><p>Article</p><h1>Basic Workflow Example</h1><p>Follow one Project from a first place to a planned visit.</p></section><h2>Overview</h2><ol><li><p>From the Map, open Dashboard → Add Project. Give the Project a name.</p></li><li><p>Open Dashboard → Context and select the new Project.</p></li><li><p>Open Dashboard → Current Project. Add the Locations the team needs to visit. Use Regions and Layers if the area has distinct sections or levels.</p></li><li><p>Create an Activity for the upcoming visit. Add a Route using the Project Locations as Stops, then create an Assignment for the person or team following it.</p></li><li><p>Select the Activity and optional Assignment in Context. Return to the Map to follow the route and open Location details.</p></li><li><p>When the work is over, archive the Activity. Keep the Project and its places for the next visit.</p></li></ol></article></noscript><div id="app"></div><!-- site-footer -->
