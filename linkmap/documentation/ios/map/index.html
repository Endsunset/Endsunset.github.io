<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Map</li></ul><p>Article</p><h1>Map</h1><p>Find places and see the work you have open in the Console.</p></section><h2>Choose what to show</h2><p>Tap Projects at the upper left and choose a Project. Open an Activity, Assignment, or Route to bring that work into view. Use Back in the Console to return to the previous level.</p><p>Tap Filter Map Data to choose All, Activity, Assignment, or Route. Options become available as you open the corresponding work.</p><p>Drag the Console sheet down when you need more room to explore the map, and up to read its details.</p><h2>Find a place</h2><ol><li><p>Tap Search Maps.</p></li><li><p>Enter a place or address.</p></li><li><p>Tap a suggestion to move the map to that place.</p></li></ol><p>Search results help you explore the map. To keep a place in your Project, add a Location; see <a href="../locations/index.html">Locations</a>.</p><h2>Open a Location</h2><p>Tap a Location marker to open its details. You can read its name and details or use Navigation to open a maps app. See <a href="../apple-maps/index.html">Maps</a>.</p><h2>Edit places</h2><p>From your Project, tap More, then Edit Map. Use Add to create a Location or Region, or tap an existing Location to edit it.</p><p>Tap Done in an editor to keep that record’s changes in the editing session. When you have finished all your changes, tap Save in the map toolbar. Cancel in that toolbar discards the session. If saving fails, your edits remain available while you resolve the problem and try again.</p><p>See <a href="../regions-and-layers/index.html">Regions and Layers</a> to organize areas and levels.</p></article></noscript><div id="app"></div><!-- site-footer -->
