<!-- End shared header --><noscript><article><section><ul><li><a href="../index.html">LinkMap</a></li><li>LinkMap for Web</li></ul><p>Article</p><h1>LinkMap for Web</h1><p>Open LinkMap in a browser to explore places and view your Project map.</p></section><h2>Open the web map</h2><p>Go to the <a href="https://endsunset.github.io/linkmap/app/">LinkMap web map</a>. There is no app to install. You can search for places and inspect coordinates without signing in. To view your own or shared Projects, sign in with the Apple Account you use for LinkMap.</p><h3>Sign in to view your Projects</h3><ol><li><p>Choose Sign in on the web map.</p></li><li><p>Sign in with the same Apple Account you use for LinkMap on iOS. This is a separate browser sign-in, even if you already use the iOS app.</p></li><li><p>Use the Project selector above the map to choose a Project you own or have joined.</p></li></ol><p>The selected Project’s Locations appear on the map. Choose a Location to inspect it. You can switch Projects without signing in again.</p><p>If a shared Project is missing, check that you accepted its invitation in the iOS app, then load the web map again. If a Project has no visible Locations, add places in the iOS app and reload the web map.</p><h3>Find a place or address</h3><p>Type a place or address in Search and choose a suggestion or result. The map moves to the selected place and shows its details when available. Your Project Locations remain available when you change the search selection.</p><h3>Show and copy coordinates</h3><p>Enter a latitude and longitude pair in Coordinates, then choose Show on map. For example, enter <code>37.3349, -122.0090</code>. Choose Copy to share the coordinate text.</p><h3>Continue planning on iOS</h3><p>Use the iOS app to create Projects, add or edit Locations, plan Activities and Routes, and manage sharing. See <a href="../ios-platform/index.html">LinkMap for iOS</a> to get started.</p></article></noscript><div id="app"></div><!-- Shared foo
