<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Regions and Layers</li></ul><p>Article</p><h1>Regions and Layers</h1><p>Group nearby places and organize levels within your Project.</p></section><h2>Overview</h2><p>A Region groups Locations in an area, such as a building. A Layer groups Locations at a level within that Region, such as a floor. Each Location can belong to one Region and one Layer.</p><h2>Add a Region</h2><ol><li><p>Open your Project, tap More, then Edit Map.</p></li><li><p>Tap Add, then Region.</p></li><li><p>Select the Locations for the Region on the map, then tap Add Region.</p></li><li><p>Enter a name and tap Done.</p></li><li><p>Tap Save in the map toolbar.</p></li></ol><p>Available Locations appear red, selected Locations blue, and unavailable Locations grey. A Location already in another Region cannot be selected for this Region.</p><h2>Add a Layer</h2><ol><li><p>While editing the map, tap Filter and choose All or Region. Tap the Region’s purple marker to open its editor.</p></li><li><p>Tap Add Layer.</p></li><li><p>Enter a name and choose a Level. Use a unique, nonzero number within the Region; zero is reserved for the base map.</p></li><li><p>Tap Select Locations, then choose the places on the map. Grey Locations are unavailable, including places already in another Layer.</p></li><li><p>Tap Save to accept the selection, then Done in the Layer editor.</p></li><li><p>Tap Done in the Region editor, then Save in the map toolbar.</p></li></ol><p>You can also assign a Location to a Region and Layer in its Location editor. See <a href="../locations/index.html">Locations</a>.</p><h2>Change a Region or Layer</h2><p>You need permission to edit the Project.</p><ol><li><p>Open Edit Map and tap the Region marker to open its editor.</p></li><li><p>Change the Region name or use Select Locations to adjust its places.</p></li><li><p>Open a Layer to change its name, Level, or selected Locations. Keep its Level unique and nonzero within the Region.</p></li><li><p>Tap Done in each editor, review Apply Changes for existing records, then Save in the map toolbar.</p></li></ol><p>Locations unavailable for that Region or Layer remain grey. Moving a Location to another Region can require choosing a different Layer as well. Cancel in the map toolbar discards the editing session.</p><h2>Show a Layer on the map</h2><p>Move the center of the map into a Layer’s area to show the Layer selector. Choose a Layer to see that level, or choose Map to return to the base map. A Layer’s outline comes from its Locations.</p></article></noscript><div id="app"></div><!-- site-footer -->
