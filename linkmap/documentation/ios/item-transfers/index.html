<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Item Transfers</li></ul><p>Article</p><h1>Item Transfers</h1><p>Record Supply, give Items to teams, and return or transfer their remaining quantities.</p></section><h2>Overview</h2><p>Create <a href="../items/index.html">Items</a> in the Project first. Transfers require an Active Activity and permission to edit that Activity. Planning and Ended Activities are read-only for resources.</p><h2>Choose where to record a movement</h2><p>Open the Project’s Activities, choose the active Activity, then use Record Item Transfers in the Activity or Assignment details. If you are in a Resources screen, use the same action there.</p><table><thead><tr><th>Open record</th><th>Action</th><th>Movement</th></tr></thead><tbody><tr><td>Activity</td><td>Supply</td><td>Add Items from outside the Activity to its available quantity.</td></tr><tr><td>Activity</td><td>Transfer</td><td>Move Items from the Activity to one of its Assignments.</td></tr><tr><td>Assignment</td><td>Return</td><td>Move remaining Items back to its Activity.</td></tr><tr><td>Assignment</td><td>Transfer</td><td>Move Items to another Assignment in the same Activity.</td></tr></tbody></table><p>Use a Route’s Stop fields to record deliveries. Routes have no separate stock balance. See <a href="../routes-and-stops/index.html">Routes and Stops</a>.</p><h2>Record Supply and allocate it to an Assignment</h2><ol><li><p>Open the active Activity and tap Record Item Transfers.</p></li><li><p>Tap New Record, choose an Item, then choose Supply under Select Action.</p></li><li><p>Enter a positive Quantity and tap Add. This stages the record; it has not been saved yet.</p></li><li><p>Tap New Record again, choose the Item, then choose Transfer.</p></li><li><p>Choose the destination Assignment under To, enter a Quantity, and tap Add.</p></li><li><p>Repeat for other Items or Assignments. Finish or cancel the open editor before continuing.</p></li><li><p>Tap Review. Check each Item, quantity, From, and To.</p></li><li><p>Tap Save and wait for confirmation and the updated Resources display.</p></li></ol><p>Cancel at the top closes the workflow without saving its staged batch. Cancel inside a New Record or quantity editor cancels only that edit.</p><p>For example, Supply 100 Water bottles and transfer 30 to Team A. After saving, the Activity has 70 available and Team A has 30. Delivering 12 at Team A’s Stops leaves 18 with Team A.</p><h2>Stay within the available quantity</h2><p>Limit to Available Quantity is on by default in the Activity workflow. It includes Supply staged in the same batch. Reduce an allocation or add the Supply you actually received if there is a shortage.</p><p>If you turn the limit off and enter an excessive allocation, review Suggested Supply Adjustment. Update accepts both the allocation and the proposed Supply quantity; Cancel leaves Supply unchanged. Accept it only when it matches the Items actually supplied. Turning the limit off does not save a shortage by itself.</p><p>Assignment returns and outgoing transfers must stay within that Assignment’s combined available balance. Items already delivered at Stops are no longer available to transfer.</p><h2>Return Items or transfer them between teams</h2><ol><li><p>Open the active Activity, then Assignments, and choose the Assignment holding the Items.</p></li><li><p>Tap Record Item Transfers, then New Record.</p></li><li><p>Choose the Item and select Return to send it to the Activity, or Transfer to choose another Assignment.</p></li><li><p>Enter the positive Quantity and tap Add.</p></li><li><p>Tap Review, check the endpoints and quantities, then Save.</p></li></ol><p>Only other Assignments in this Activity are offered as destinations. To supply a different Activity, open that Activity and record its own Supply.</p><h2>Correct a staged record</h2><p>Before saving, tap a staged row to change its Quantity, then tap Update. Cancel restores the previous draft quantity. Delete removes the staged row; setting it to zero asks you to confirm removal. To change the Item, action, or destination, remove the row and add a new one.</p><p>Each batch can contain at most 80 records, including Supply. Use one row for each Item and movement between the same endpoints; edit its quantity instead of adding a duplicate.</p><h2>Read saved history</h2><p>Open History under Item Transfer History, or read the history rows shown in the detail. Each entry identifies the Item, quantity, direction, and Recorded On date and time. No Transfers Recorded means there are no saved movements in that view.</p><p>Saved history is read-only. The staged-row editor changes unsaved rows only. Record a new return or transfer for a real reverse movement; correct Stop deliveries through their Stop fields.</p><h2>If Review or Save is unavailable</h2><p>Finish the current New Record or quantity editor, choose all required values, and resolve shortages. If saving fails, the workflow keeps your staged values so you can correct them and Review again. Check the current balances, permissions, and Activity status before retrying. If the owner has ended the Activity, further resource changes cannot be saved.</p></article></noscript><div id="app"></div><!-- site-footer -->
