<!-- /site-header --><noscript><article><section><ul><li><a href="../index.html">LinkMap for Web</a></li><li>Regions and Layers</li></ul><p>Article</p><h1>Regions and Layers</h1><p>Browse grouped places and inspect saved levels in a Project.</p></section><h2>Browse a Region</h2><ol><li><p>Choose Project and select your Project.</p></li><li><p>Under Browse project, choose Regions, then choose a Region.</p></li><li><p>Choose Locations to see the Region’s places, or choose a Layer to inspect its details.</p></li></ol><p>A Region groups related Locations and Layers, such as the places in a building. You can also open a Region from a Location’s or Layer’s details.</p><h2>Inspect a Layer</h2><ol><li><p>Choose Project → Layers, or open a Layer from a Region or Location.</p></li><li><p>Review its Name, Level, and Location count.</p></li><li><p>Choose a Location in its list to inspect the saved place.</p></li><li><p>Use the Region link, when available, to open the group it belongs to.</p></li></ol><p>The Region lists Layers from higher to lower levels, with Map · Level 0 among them. Show layer on map is also available in Layer details. The current web map remains at ground level when you choose either control; these controls do not switch to another floor or reveal its markers.</p><h2>Understand ground-level viewing</h2><p>Level 0 is the ground level. The map shows Locations without a Layer and those belonging to level-zero Layers, together with their saved area outlines. Locations on higher and lower levels remain readable from Project, Region, and Layer lists.</p><p>Use LinkMap for iOS to view and edit other map levels, create Regions or Layers, or move a Location between them. Refresh the selected Project in the web app after saving your changes. See <a href="../icloud/index.html">iCloud</a>.</p></article></noscript><div id="app"></div><!-- site-footer -->
