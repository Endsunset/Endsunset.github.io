<!-- /site-header --><nav class="linkmap-collections" aria-label="Documentation collections"><a href="/linkmap/documentation/">All Collections</a></nav><noscript><article><section><ul><li><a href="../index.html">LinkMap for iOS</a></li><li>Assignments</li></ul><p>Article</p><h1>Assignments</h1><p>Group the Routes for a person or team within an Activity.</p></section><h2>Create an Assignment</h2><p>While the Activity is in Planning and you have permission to edit it:</p><ol><li><p>Open the Activity, then Assignments.</p></li><li><p>Tap the plus button.</p></li><li><p>Enter an Assignment name.</p></li><li><p>Select the Routes for the person or team. The list shows Routes that are not already assigned.</p></li><li><p>Tap Save.</p></li></ol><p>An Assignment can include several Routes. Prepare these connections before starting the Activity; starting locks the plan.</p><p>An Assignment organizes the work. To give someone access to it, share the Project and Activity with them; see <a href="../sharing/index.html">Sharing</a>.</p><h2>Open your work</h2><p>In an active Activity, tap Assignments and choose an Assignment. Open Routes and choose a Route to see its Stops. The map shows the work you open in the Console.</p><h2>Preview and share a report</h2><ol><li><p>Open an Assignment in an active Activity.</p></li><li><p>Tap Preview Report.</p></li><li><p>Tap Copy to copy the report text, or Share to choose a destination.</p></li></ol><p>Use Refresh to update the preview. Report Settings lets you adjust its presentation. You can also open Settings from Projects and choose Report Style.</p></article></noscript><div id="app"></div><!-- site-footer -->
